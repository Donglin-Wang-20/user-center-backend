spring:
  application:
    name: user-center
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    username: root
    password: 123456789
    url: jdbc:mysql://localhost:3306/yupi
  # session 失效时间
  session:
    timeout: 86400
server:
  port: 8087
mybatis-plus:
    configuration:
      map-underscore-to-camel-case: false
    global-config:
      db-config:
        logic-delete-field: isDelete # 全局逻辑删除字段名(deleted为实体类属性名称)
        logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
        logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0